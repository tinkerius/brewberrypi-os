name: build

on:
  push:
    branches: [main]
    # A version tag (v1.2.3) also publishes a draft release (job 'release').
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            shellcheck yamllint jq python3-yaml python3-debian python3-jsonschema

      - name: Lint
        run: scripts/lint.sh

  signing:
    name: signature policy
    runs-on: ubuntu-24.04
    env:
      # cosign v2.x: v3's default signature format is unreadable for Podman 5.4.
      COSIGN_VERSION: v2.5.3
      COSIGN_SHA256: 783b5d6c74105401c63946c68d9b2a4e1aab3c8abce043e06b8510b02b623ec9
    steps:
      - uses: actions/checkout@v4

      - name: Install skopeo, jq and cosign
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo jq
          sudo curl -sSfL -o /usr/local/bin/cosign \
            "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-linux-amd64"
          echo "$COSIGN_SHA256  /usr/local/bin/cosign" | sha256sum -c -
          sudo chmod +x /usr/local/bin/cosign

      - name: Signature policy test
        run: tests/integration/signing.sh

  image:
    name: image (${{ matrix.board }})
    needs: lint
    # rpi-image-gen builds natively on arm64 only (ADR-0001).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
      # Pull the app release to preload (BREWBERRY_APP_VERSION).
      packages: read
    strategy:
      fail-fast: false
      matrix:
        # pi34: Raspberry Pi 3 and 4 (v8 kernel); pi5: Raspberry Pi 5 (2712 kernel).
        board: [pi34, pi5]
    steps:
      - uses: actions/checkout@v4
        with:
          # git describe needs the tags for the image version.
          fetch-depth: 0

      - name: Install rpi-image-gen and its dependencies
        run: |
          . scripts/common.sh
          fetch_rpi_image_gen
          sudo apt-get update
          # rpi-image-gen runs as the runner user and needs to traverse $HOME.
          sudo chmod o+x "$HOME"
          sudo "$RPI_IMAGE_GEN_DIR/install_deps.sh"

      # With the repository variable BREWBERRY_APP_VERSION (x.y.z), the image
      # preloads that app release instead of the contract stub (OS8). The token
      # needs read access to the app's package: the secret BREWBERRY_GHCR_TOKEN
      # (classic PAT, read:packages), or GITHUB_TOKEN once this repository is
      # granted access in the package's settings (Manage Actions access).
      - name: Log in to GHCR for the app preload
        if: vars.BREWBERRY_APP_VERSION != ''
        env:
          TOKEN: ${{ secrets.BREWBERRY_GHCR_TOKEN || github.token }}
        run: |
          sudo apt-get install -y --no-install-recommends skopeo jq
          echo "$TOKEN" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image
        env:
          BREWBERRY_SSH_PUBKEY: ${{ vars.BREWBERRY_SSH_PUBKEY }}
          BREWBERRY_APP_VERSION: ${{ vars.BREWBERRY_APP_VERSION }}
        run: |
          if [ -z "$BREWBERRY_SSH_PUBKEY" ]; then
            echo "::warning::Repository variable BREWBERRY_SSH_PUBKEY is not set; this image has no SSH login."
          fi
          scripts/build.sh brewberrypi-${{ matrix.board }}.yaml

      - uses: actions/upload-artifact@v4
        with:
          name: brewberrypi-os-${{ matrix.board }}
          path: deploy/
          # The image is already xz-compressed.
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

  release:
    needs: [lint, signing, image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: brewberrypi-os-*
          path: release
          merge-multiple: true

      - name: Imager manifest and checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd release
          ../scripts/imager-manifest.py \
            --url-base "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" \
            brewberrypi-os-*.img.xz > brewberrypi-os.rpi-imager-manifest
          sha256sum brewberrypi-os-*.img.xz brewberrypi-os.rpi-imager-manifest > SHA256SUMS
          cat SHA256SUMS

      # A draft: it is published by hand once the hardware checks pass
      # (tests/hardware/README.md).
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NOTES: >-
            Flash with Raspberry Pi Imager 2.x through brewberrypi-os.rpi-imager-manifest
            to get its customisation (hostname, user, SSH key, Wi-Fi): see docs/flashing.md.
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "BrewberryPi OS $TAG" --generate-notes \
            --notes "$NOTES" \
            release/brewberrypi-os-*.img.xz release/brewberrypi-os.rpi-imager-manifest release/SHA256SUMS
