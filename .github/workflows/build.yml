name: build

on:
  push:
    branches: [main]
    # A version tag (v1.2.3) also creates a release (jobs 'draft', 'image', 'release').
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            shellcheck yamllint jq python3-yaml python3-debian python3-jsonschema

      - name: Lint
        run: scripts/lint.sh

  signing:
    name: signature policy
    runs-on: ubuntu-24.04
    env:
      # cosign v2.x: v3's default signature format is unreadable for Podman 5.4.
      COSIGN_VERSION: v2.5.3
      COSIGN_SHA256: 783b5d6c74105401c63946c68d9b2a4e1aab3c8abce043e06b8510b02b623ec9
    steps:
      - uses: actions/checkout@v4

      - name: Install skopeo, jq and cosign
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo jq
          sudo curl -sSfL -o /usr/local/bin/cosign \
            "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-linux-amd64"
          echo "$COSIGN_SHA256  /usr/local/bin/cosign" | sha256sum -c -
          sudo chmod +x /usr/local/bin/cosign

      - name: Signature policy test
        run: tests/integration/signing.sh

  # Tags only: the draft release the image jobs upload to. It stays invisible
  # to others until the 'release' job publishes it (pre-release tags) or a
  # maintainer does after the hardware checks (docs/releasing.md).
  draft:
    name: draft release
    needs: [lint, signing]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NOTES: >-
            Flash with Raspberry Pi Imager 2.x through brewberrypi-os.rpi-imager-manifest
            to get its customisation (hostname, user, SSH key, Wi-Fi): see docs/flashing.md.
            While the repository is private, download the images and write a local manifest
            (scripts/imager-manifest.py --local).
          PRERELEASE_NOTES: |
            > [!WARNING]
            > **Pre-release: not yet tested on hardware.** It builds and passes CI, but
            > the hardware checks (tests/hardware/README.md) have not been run on these images.
            > Never connect a mains heater: use LEDs or the relay board on its own. The image
            > preloads the app named in `/etc/brewberry-release` (`BREWBERRY_OS_APP_PRELOAD`;
            > `stub` is the contract stub, not the brewing app). Reflashing erases `/data`.
        run: |
          # A re-run finds the draft from the first attempt.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
             echo "release $TAG exists already"; exit 0
          fi
          case $TAG in
             v*-*) notes="$PRERELEASE_NOTES"$'\n'"$NOTES" ;;
             *)    notes=$NOTES ;;
          esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "BrewberryPi OS $TAG" --generate-notes --notes "$notes"

  image:
    name: image (${{ matrix.board }})
    needs: [lint, draft]
    # On a tag only once the draft release exists; otherwise after lint.
    if: >-
      !cancelled() && needs.lint.result == 'success' &&
      (needs.draft.result == 'success' || !startsWith(github.ref, 'refs/tags/v'))
    # rpi-image-gen builds natively on arm64 only (ADR-0001).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      # Upload the image to the draft release (tags only).
      contents: write
      # Pull the app release to preload (BREWBERRY_APP_VERSION).
      packages: read
    strategy:
      fail-fast: false
      matrix:
        # pi34: Raspberry Pi 3 and 4 (v8 kernel); pi5: Raspberry Pi 5 (2712 kernel).
        board: [pi34, pi5]
    steps:
      - uses: actions/checkout@v4
        with:
          # git describe needs the tags for the image version.
          fetch-depth: 0

      - name: Install rpi-image-gen and its dependencies
        run: |
          . scripts/common.sh
          fetch_rpi_image_gen
          sudo apt-get update
          # rpi-image-gen runs as the runner user and needs to traverse $HOME.
          sudo chmod o+x "$HOME"
          sudo "$RPI_IMAGE_GEN_DIR/install_deps.sh"

      # With the repository variable BREWBERRY_APP_VERSION (1.2.3 or 1.2.3-alpha.N), the image
      # preloads that app release instead of the contract stub (OS8). The token
      # needs read access to the app's package: the secret BREWBERRY_GHCR_TOKEN
      # (classic PAT, read:packages), or GITHUB_TOKEN once this repository is
      # granted access in the package's settings (Manage Actions access).
      - name: Log in to GHCR for the app preload
        if: vars.BREWBERRY_APP_VERSION != ''
        env:
          TOKEN: ${{ secrets.BREWBERRY_GHCR_TOKEN || github.token }}
        run: |
          sudo apt-get install -y --no-install-recommends skopeo jq
          echo "$TOKEN" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image
        env:
          BREWBERRY_SSH_PUBKEY: ${{ vars.BREWBERRY_SSH_PUBKEY }}
          BREWBERRY_APP_VERSION: ${{ vars.BREWBERRY_APP_VERSION }}
          # Release builds are named after their tag (scripts/build.sh).
          BREWBERRY_OS_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          if [ -z "$BREWBERRY_SSH_PUBKEY" ]; then
            echo "::warning::Repository variable BREWBERRY_SSH_PUBKEY is not set; this image has no SSH login."
          fi
          scripts/build.sh brewberrypi-${{ matrix.board }}.yaml

      # No Actions artifacts: images go straight to the release, whose assets don't
      # count against the Actions storage quota (0.5 GB on the Free plan; one run's
      # images are about 485 MB). Builds of branches and pull requests only check
      # that the image builds.
      - name: Upload to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          command -v gh > /dev/null || sudo apt-get install -y --no-install-recommends gh
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber deploy/brewberrypi-os-*.img.xz

  release:
    needs: [draft, image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the images from the draft
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'brewberrypi-os-*.img.xz' --dir release

      - name: Imager manifest and checksums
        run: |
          cd release
          ../scripts/imager-manifest.py \
            --url-base "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" \
            brewberrypi-os-*.img.xz > brewberrypi-os.rpi-imager-manifest
          sha256sum brewberrypi-os-*.img.xz brewberrypi-os.rpi-imager-manifest > SHA256SUMS
          cat SHA256SUMS

      # A version tag (v1.2.3) stays a draft: it is published by hand once the
      # hardware checks pass (docs/releasing.md). A pre-release tag
      # (v1.2.3-alpha.1, -beta.N, -rc.N) is published at once as a GitHub
      # pre-release, never "Latest", with a warning that it is untested.
      - name: Complete the release
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            release/brewberrypi-os.rpi-imager-manifest release/SHA256SUMS
          case $TAG in
             v*-*) gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
                      --draft=false --prerelease --latest=false ;;
             *)    echo "draft $TAG is complete; publish it once the hardware checks pass" ;;
          esac
