# BrewberryPi OS: everything except the board. Not built on its own; the
# board configs (brewberrypi-pi34.yaml, brewberrypi-pi5.yaml) include it.
#
# Built with rpi-image-gen (see scripts/common.sh for the pinned version).
# Layout (image-brewberry): p1 boot, p2 root (fixed), p3 DATA (grown on
# first boot). The system seals itself after first boot (brewberry-readonly).
# The app runs under Podman + Quadlet; the preloaded image is the contract stub
# until the app is released (brewberry-podman). Host-side safety: strict_gpiod,
# boot-time off levels, outputs-off reset, watchdogs (brewberry-safety).
# Signed updates, rollback and safe mode (brewberry-update). NetworkManager
# (brewberry-suite) and cloud-init for Raspberry Pi Imager's customisation on
# the first boot (brewberry-imager).

device:
  hostname: brewberrypi
  user1: brewberry
  # The device account, an administrator like an Imager user. Its default
  # password 'pi' is set by brewberry-web (rpi-image-gen's user1pass refuses
  # weak passwords) and logs in to the device web interface on port 8081.
  # SSH stays key-only unless Imager enables password logins.
  user1sudo: nopasswd

image:
  layer: image-brewberry
  boot_part_size: 512M
  root_part_size: 3584M
  data_part_size: 256M

ssh:
  # pubkey_user1 is passed by scripts/build.sh from BREWBERRY_SSH_PUBKEY
  # (optional: Imager can add a key). Password logins follow Imager's SSH
  # setting (cloud-init's ssh_pwauth) and are off by default:
  # brewberry-imager's sshd_config.d/90-brewberry.conf, which also keeps root
  # logins off. rpi-image-gen's pubkey_only would refuse passwords always.
  pubkey_only: n

layer:
  base: brewberry-suite
  app: brewberry-base
  readonly: brewberry-readonly
  safety: brewberry-safety
  podman: brewberry-podman
  update: brewberry-update
  imager: brewberry-imager
  web: brewberry-web
