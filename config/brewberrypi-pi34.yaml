# BrewberryPi OS image for Raspberry Pi 3 and 4.
#
# The rpi3 device layer pulls in rpi-generic64: the v8 kernel (4K pages) and
# boot firmware for all devices, so the same image boots on a Pi 3 and a Pi 4.

include:
  file: brewberrypi-base.yaml

device:
  layer: rpi3

image:
  name: brewberrypi-os-pi34
