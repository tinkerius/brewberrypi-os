# BrewberryPi OS (OS7). cloud-init applies Raspberry Pi Imager's customisation
# (hostname, user and SSH key, Wi-Fi, time zone) on the first boot only:
# brewberry-seal disables cloud-init before it seals the system.
# Merged into /etc/cloud/cloud.cfg; rpi-cloud-init-mods' 99_raspberry-pi.cfg
# reads the NoCloud seed from /boot/firmware.
system_info:
  # Without customisation, the default user is the image's own account
  # instead of a new 'pi' (Raspberry Pi OS) or 'debian' account.
  default_user:
    name: brewberry
  # Imager's network-config is netplan v2 with Wi-Fi; netplan hands it to
  # NetworkManager (rpi-cloud-init-mods' 00-network-manager-all.yaml).
  network:
    renderers: [netplan]
    activators: [netplan]

# The apt sources stay as built (Debian and Raspberry Pi archives) instead of
# being regenerated from cloud-init's template.
apt:
  preserve_sources_list: true

# The root partition has a fixed size, and the DATA partition follows it;
# brewberry-growdata grows DATA instead.
growpart:
  mode: "off"
resize_rootfs: false
