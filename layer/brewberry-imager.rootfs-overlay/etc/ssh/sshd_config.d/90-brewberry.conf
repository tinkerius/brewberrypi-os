# BrewberryPi OS (OS7): SSH defaults. Raspberry Pi Imager decides password
# logins: cloud-init writes its ssh_pwauth choice to 50-cloud-init.conf, and
# sshd takes the first value it reads, so that file wins over this one. The
# default, without Imager's choice, is keys only.
PasswordAuthentication no
KbdInteractiveAuthentication no
GSSAPIAuthentication no
PubkeyAuthentication yes
PermitRootLogin no
