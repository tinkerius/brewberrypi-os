# NoCloud reads Imager's seed (meta-data, user-data, network-config) from
# /boot/firmware (rpi-cloud-init-mods' 99_raspberry-pi.cfg). Without this,
# cloud-init can run before /boot/firmware is mounted, finds no seed and
# applies nothing: no user, no Wi-Fi (RPi-Distro/rpi-cloud-init-mods#2;
# found on a Pi 3 with v0.1.0-alpha.2).
[Unit]
RequiresMountsFor=/boot/firmware
