# METABEGIN
# X-Env-Layer-Name: brewberry-podman
# X-Env-Layer-Category: app
# X-Env-Layer-Desc: App runtime (ADR-0001, OS2): rootful Podman with its
#  storage and pull staging on /data, the Quadlet unit brewberrypi.container
#  running localhost/brewberrypi:active, GPIO device access for the gpio group,
#  write access to /data/config/app for the brewberry-config group,
#  port 80 forwarded to the app's port (brewberrypi-port80),
#  and brewberry-firstload, which imports the app image preloaded in the OS
#  image and tags it active.
# X-Env-Layer-Version: 1.0.0
# X-Env-Layer-Requires: brewberry-readonly,brewberry-safety
#
# X-Env-VarPrefix: app
#
# X-Env-Var-preload:
# X-Env-Var-preload-Desc: Path on the build host to the app image to preload,
#  in 'dir:' format (podman save --format docker-dir). scripts/build.sh builds
#  the contract stub and sets this.
# X-Env-Var-preload-Required: y
# X-Env-Var-preload-Valid: string
# X-Env-Var-preload-Set: y
# METAEND
---
mmdebstrap:
  packages:
    - podman
    - crun
    - conmon
    - netavark
    # groupadd for the brewberry-config group
    - passwd
    # brewberrypi-port80: port 80 forwarded to the app
    - nftables
  customize-hooks:
    - |-
      set -eu
      test -f "$IGconf_app_preload/manifest.json"
      mkdir -p "$1/usr/share/brewberrypi"
      cp -r "$IGconf_app_preload" "$1/usr/share/brewberrypi/preload"
      chmod -R u=rwX,go=rX "$1/usr/share/brewberrypi/preload"
    - |-
      set -eu
      # brewberrypi-port80 loads its own table; the nftables service would load
      # /etc/nftables.conf (flush ruleset) at boot, which BrewberryPi OS doesn't use.
      if [ -e "$1/usr/lib/systemd/system/nftables.service" ]; then
         systemctl --root="$1" disable nftables.service
      fi
    - |-
      set -eu
      # The group of the app's folder /data/config/app (brewberry-datalayout):
      # the app container and the share's user (brewberry-share) are in it.
      chroot "$1" getent group brewberry-config > /dev/null || chroot "$1" groupadd --system brewberry-config
      # Quadlet needs the numeric GIDs; they are assigned during the build.
      gid=$(awk -F: '$1 == "gpio" { print $3 }' "$1/etc/group")
      [ -n "$gid" ] || { echo "brewberry-podman: no gpio group in the image" >&2; exit 1; }
      config_gid=$(awk -F: '$1 == "brewberry-config" { print $3 }' "$1/etc/group")
      [ -n "$config_gid" ] || { echo "brewberry-podman: no brewberry-config group in the image" >&2; exit 1; }
      tmpl="$1/usr/share/brewberrypi/brewberrypi.container.in"
      mkdir -p "$1/etc/containers/systemd"
      awk -v gid="$gid" -v config_gid="$config_gid" '
         /@GPIO_DEVICES@/ { for (n = 0; n < 32; n++) printf "AddDevice=-/dev/gpiochip%d\n", n; next }
         { gsub(/@GPIO_GID@/, gid); gsub(/@CONFIG_GID@/, config_gid); print }
      ' "$tmpl" > "$1/etc/containers/systemd/brewberrypi.container"
      rm "$tmpl"
      # Fail the build if Quadlet (the image's own Podman) cannot convert it.
      chroot "$1" env QUADLET_UNIT_DIRS=/etc/containers/systemd \
         /usr/libexec/podman/quadlet -dryrun -no-kmsg-log > "$1/tmp/quadlet.out" 2>&1 || true
      if ! grep -q -- '---brewberrypi.service---' "$1/tmp/quadlet.out"; then
         cat "$1/tmp/quadlet.out" >&2
         echo "brewberry-podman: Quadlet rejected brewberrypi.container" >&2
         exit 1
      fi
      rm "$1/tmp/quadlet.out"
    - $BDEBSTRAP_HOOKS/enable-units "$1" brewberry-firstload.service
