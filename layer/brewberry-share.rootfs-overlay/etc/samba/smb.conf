# BrewberryPi OS file share (ADR-0003, OS10): /data/config, the folder the app
# reads config.json and recipes/ from, as \\<hostname>.local\config. Only the
# user brewberry, with the same password as the device web interface
# (brewberry-share-sync keeps the share's password in step). Nothing else is
# shared: no home folders, printers or user shares. Check with testparm -s.

[global]
   server string = BrewberryPi OS %h
   server role = standalone server
   workgroup = WORKGROUP
   security = user
   # SMB 3 only, port 445 only: no NetBIOS (nmbd is disabled), no SMB 1 or 2.
   # Windows 8 and newer, macOS and Linux all speak SMB 3.
   server min protocol = SMB3
   smb ports = 445
   disable netbios = yes
   # Every request signed, encrypted when the client offers it.
   server signing = mandatory
   server smb encrypt = desired
   # No guests, no anonymous listing, never root.
   map to guest = never
   restrict anonymous = 2
   invalid users = root
   # Password hashes and the server's identity (secrets.tdb) on /data, so they
   # survive the reboot; the overlay root forgets everything else. Only
   # brewberry-share-sync changes them. Lock, state and cache files stay in RAM.
   passdb backend = tdbsam
   private dir = /data/secrets/samba
   unix password sync = no
   pam password change = no
   # Logs go to the journal: brewberry-system logs share.
   logging = systemd
   log level = 1
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   usershare max shares = 0

[config]
   comment = BrewberryPi app configuration
   path = /data/config
   valid users = brewberry
   force user = brewberry
   force group = brewberry
   read only = no
   # The app reads the files as another user inside its container: keep them
   # world-readable, and writable only by brewberry.
   create mask = 0644
   force create mode = 0644
   directory mask = 0755
   force directory mode = 0755
   nt acl support = no
   # No links out of the folder.
   follow symlinks = no
   wide links = no
   # macOS keeps its metadata in extended attributes instead of ._ files.
   vfs objects = catia fruit streams_xattr
   fruit:metadata = stream
   fruit:resource = stream
   fruit:delete_empty_adfiles = yes
   fruit:wipe_intentionally_left_blank_rfork = yes
   # Desktop clutter, and brewberry-config's staging folder.
   veto files = /.DS_Store/Thumbs.db/desktop.ini/.recipes.new/
   delete veto files = yes
