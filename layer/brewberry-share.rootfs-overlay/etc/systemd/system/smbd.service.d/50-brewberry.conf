# The file share (ADR-0003, OS10): /data must be mounted, the passwords
# restored, and the share's own password and file owners in step before smbd
# starts. 'brewberry-share off' creates the marker below; the share then stays
# off across reboots.
[Unit]
Requires=data.mount
After=data.mount brewberry-datalayout.service brewberry-passwd-restore.service
ConditionPathExists=!/data/secrets/samba/disabled

[Service]
ExecStartPre=+/usr/local/sbin/brewberry-share-sync start
