# The file share (ADR-0003, OS10), always on: /data must be mounted, the
# passwords restored, and the share's own password and file owners in step
# before smbd starts; it comes back by itself if it fails.
[Unit]
Requires=data.mount
After=data.mount brewberry-datalayout.service brewberry-passwd-restore.service

[Service]
ExecStartPre=+/usr/local/sbin/brewberry-share-sync start
Restart=on-failure
RestartSec=5
